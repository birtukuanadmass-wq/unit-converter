Converter</h1>

<p>Kilometers:</p>
<input type="number" id="km">

<button onclick="convert()">Convert to Miles</button>

<h2 id="result"></h2>

<script>
function convert() {
let km = document.getElementById("km").value;
let miles = km * 0.621371;
document.getElementById("result").innerHTML =
km + " km = " + miles.toFixed(2) + " miles";
}
</script>

</body>
</html>
